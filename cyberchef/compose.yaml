name: dev-tools-cyberchef

services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:${CYBERCHEF_VERSION:-11.5.0}
    restart: "no"
    ports:
      - "127.0.0.1:${CYBERCHEF_PORT:-8085}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
