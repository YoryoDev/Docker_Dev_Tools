name: dev-tools-plantuml

services:
  plantuml:
    image: plantuml/plantuml-server:${PLANTUML_VERSION:-jetty-v1.2026.8}
    restart: "no"
    ports:
      - "127.0.0.1:${PLANTUML_PORT:-8082}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
