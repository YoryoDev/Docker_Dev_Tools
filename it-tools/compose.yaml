name: dev-tools-it-tools

services:
  it-tools:
    image: corentinth/it-tools:${IT_TOOLS_VERSION:-2024.10.22-7ca5933}
    restart: "no"
    ports:
      - "127.0.0.1:${IT_TOOLS_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
