name: dev-tools-chartdb

services:
  chartdb:
    image: ghcr.io/chartdb/chartdb:${CHARTDB_VERSION:-1.20.1}
    restart: "no"
    environment:
      DISABLE_ANALYTICS: ${CHARTDB_DISABLE_ANALYTICS:-true}
      OPENAI_API_KEY: ${CHARTDB_OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${CHARTDB_PORT:-8086}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
