name: dev-tools-drawio

services:
  drawio:
    image: jgraph/drawio:${DRAWIO_VERSION:-32.4.1}
    restart: "no"
    ports:
      - "127.0.0.1:${DRAWIO_PORT:-8083}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
